<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — SecuraPy Platform</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .box {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mark {
            width: 28px;
            height: 28px;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
        }
        h1 { margin: 0; font-size: 16px; font-weight: 600; }
        .sub { font-size: 12px; color: #64748b; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            height: 36px;
            padding: 0 11px;
            margin-bottom: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            color: #0f172a;
            background: #fff;
            outline: none;
        }
        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
        }
        button {
            width: 100%;
            height: 36px;
            background: #0f172a;
            color: #ffffff;
            font-weight: 500;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #1e293b; }
        .erro {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 9px 12px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 13px;
        }
        .cred {
            margin-top: 16px;
            padding: 10px 12px;
            background: #f1f5f9;
            border-radius: 6px;
            font-size: 12px;
            color: #475569;
            line-height: 1.6;
        }
        .cred code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color: #0f172a;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: #64748b;
            text-decoration: none;
            font-size: 12px;
        }
        .back:hover { color: #0f172a; }
    </style>
</head>
<body>
<div class="box">
    <div class="brand">
        <div class="mark">SP</div>
        <div>
            <h1>SecuraPy Platform</h1>
            <div class="sub">Acesso de Operador</div>
        </div>
    </div>

    {% if erro %}
        <div class="erro">{{ erro }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login_web') }}">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="username" value="admin@cybershield.local">

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required autocomplete="current-password">

        <button type="submit">Entrar</button>
    </form>

    <div class="cred">
        <strong>Credenciais padrão:</strong><br>
        Usuário: <code>admin@cybershield.local</code><br>
        Senha: <code>CyberShield@2026</code>
    </div>

    <a class="back" href="{{ url_for('dashboard') }}">Voltar ao painel</a>
</div>
</body>
</html>
